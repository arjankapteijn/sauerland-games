# Voor een Docker-host via SSH: kopieer dit bestand + `.env` (zie
# .env.example) naar dezelfde map en draai `docker compose pull && docker
# compose up -d`. Kant-en-klaar image van ghcr.io (gebouwd door GitHub
# Actions) — hier wordt niets lokaal gebouwd. Eenmalig inloggen bij ghcr.io
# nodig, zie README.
#
# LET OP — gebruik dit bestand NIET 1-op-1 in TrueNAS' "Install via YAML":
# die draait de compose vanuit een andere working directory (`/tmp`), dus
# het relatieve `env_file: .env` hieronder wordt niet gevonden ("env file
# /tmp/.env not found"). Gebruik daarvoor de losse YAML met een ABSOLUUT
# env_file-pad uit de README ("Uitrollen als custom app").
services:
  sauerland-games:
    image: ghcr.io/arjankapteijn/sauerland-games:latest
    container_name: sauerland-games
    pull_policy: always
    restart: unless-stopped
    ports:
      # host-poort 8091 -> container-poort 8080 (8090 is al in gebruik door
      # arjankapteijn.nl); pas de linkerkant gerust aan.
      - '8091:8080'
    env_file: .env
    volumes:
      - sauerland-games-storage:/var/www/html/storage
      - sauerland-games-database:/var/www/html/database
    # Hardening (zelfde lijn als arjankapteijn.nl/lovebox, met één verschil:
    # geen `read_only` — Laravel heeft storage/, bootstrap/cache/ en de
    # sqlite-db nodig als schrijfbare paden, die staan in de volumes hierboven).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    pids_limit: 256

volumes:
  sauerland-games-storage:
  sauerland-games-database:
